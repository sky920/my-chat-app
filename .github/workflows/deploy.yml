# GitHub Pages 自动部署工作流（gh-pages 分支模式）
# 触发条件：推送到 main 分支 / 或手动在 Actions 页点 Run workflow
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 需要写仓库内容才能推送到 gh-pages 分支
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # 关键：把 GitHub Secret 里的 Key 作为构建时的环境变量注入前端 bundle
        env:
          VITE_DEEPSEEK_API_KEY: ${{ secrets.VITE_DEEPSEEK_API_KEY }}
        run: npm run build

      - name: Deploy to gh-pages branch
        # 把 ./dist 目录的内容推送到 gh-pages 分支的根目录
        # 仓库 Pages 设置需为：Source = Deploy from branch, Branch = gh-pages / (root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
